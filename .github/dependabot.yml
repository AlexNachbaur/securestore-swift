# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Kept for the day a dependency is genuinely warranted, but expect it to stay quiet: this
  # package has NO dependencies by policy — it sits in credential paths on several platforms, so
  # anything added is a deliberate decision (see CLAUDE.md).
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"

  # This is the ecosystem that actually drifts. The workflow pins actions/checkout,
  # actions/cache, and skiptools/swift-android-action — and the Android job in particular depends
  # on a third-party action that tracks the Swift SDK for Android, so staying current matters.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
