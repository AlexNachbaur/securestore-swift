# Claude reviews pull requests and posts inline comments; every thread it opens must be
# resolved (fixed, or answered) before `main` accepts the merge — see the branch ruleset.
#
# Two ways in, deliberately different:
#
#   * A pull request from a branch of THIS repository is reviewed automatically, on open and
#     on every later push (`pull_request`). The job has the repository's secrets.
#   * A pull request from a FORK is reviewed only once a maintainer adds the `claude-review`
#     label (`pull_request_target`). Fork PRs never receive secrets under `pull_request`, and
#     `pull_request_target` runs the workflow definition from `main` with this repository's
#     secrets — so the label is the maintainer's explicit "I have looked at this submission;
#     spend a review on it". Later pushes to a labelled PR are re-reviewed; remove the label
#     to stop. Only people with triage or write access can label, so a contributor cannot
#     trigger it themselves.
#
# On a fork of this repository the secret does not exist, so the `gate` job reports it absent
# and the review skips cleanly. Nothing here touches the build: `build.yml` is the OSS
# toolchain, and this job is not a required status check, so a fork PR is never blocked by it.
#
# The reviewer runs read-only tools (gh, git diff/log/show, file reads) plus the one MCP tool
# that posts inline comments. It reads the pull request's code; it does not build or run it.
#
# CREDENTIAL: repository secret CLAUDE_CODE_OAUTH_TOKEN — a one-year OAuth token tied to the
# maintainer's Claude subscription (`claude setup-token`), so reviews bill against the plan
# rather than API credits. When it expires the review job fails with an auth error: run
# `claude setup-token` again and `gh secret set CLAUDE_CODE_OAUTH_TOKEN -R <owner>/<repo>`.
# Comments are posted through the Claude GitHub App, which must be installed for this
# repository; the job exchanges its OIDC token (`id-token: write`) for the App's.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_target:
    types: [labeled, synchronize]

# A newer push supersedes an in-flight review of the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Secrets cannot be read in a job-level `if`, so this one-step job reports whether the
  # token exists at all (it does not on forks and clones) and whether this event is one that
  # should review. Both decisions are made here so `review` has a single, readable condition.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'claude-review') }}
        run: |
          run=false
          if [ "$HAS_TOKEN" = true ] && [ "$IS_DRAFT" != true ]; then
            # Same-repo PRs review under pull_request; fork PRs only under pull_request_target
            # and only while labelled. Each PR therefore matches exactly one of the two events.
            if [ "$EVENT" = pull_request ] && [ "$IS_FORK" != true ]; then run=true; fi
            if [ "$EVENT" = pull_request_target ] && [ "$IS_FORK" = true ] && [ "$LABELLED" = true ]; then run=true; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT fork=$IS_FORK labelled=$LABELLED draft=$IS_DRAFT token=$HAS_TOKEN -> review=$run"

  review:
    name: Claude review
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # read, not write: the inline comments are posted by the Claude GitHub App's own
      # installation token, obtained through id-token, not by GITHUB_TOKEN.
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The PR's merge commit, for both events: under pull_request_target the default
          # checkout would be the base branch, and the reviewer needs to read the proposed
          # code. Reading it is all that happens to it — nothing here builds or executes it.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          # Full history: the review diffs against the merge base with the target branch.
          fetch-depth: 0

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        env:
          # The code-review plugin's triage step shells out to `gh pr view`; gh needs a token
          # of its own (the action's App token is internal to it). Read-only GITHUB_TOKEN.
          GH_TOKEN: ${{ github.token }}
          # The review skill runs its triage gate as a background subagent and waits for a
          # completion notification that a headless run never delivers; without this the run
          # exits cleanly having reviewed nothing.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review high --comment
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # Names the MCP tool that posts inline comments; the action starts that server only
          # when --allowedTools asks for it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Overrides this repository's .claude/settings.json for the run. A headless run has
          # no permission prompt, so any tool not matched by an allow rule is denied — and the
          # repo's own allow-list names build commands, not what a reviewer uses. All read-only.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh:*)",
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Read",
                  "Glob",
                  "Grep",
                  "Skill",
                  "Task",
                  "TodoWrite"
                ]
              }
            }
